name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # cache: npm requires at least one lockfile to exist.
          # cache-dependency-path lists all three package trees so the cache
          # key reflects changes in any of them.
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      # Cache the MongoDB binary used by MongoMemoryReplSet in integration tests.
      # Placed BEFORE dependency installation so the binary is available the moment
      # integration tests start. On cache miss the binary downloads automatically;
      # actions/cache saves it at job completion for the next run.
      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binary-7.0.14

      # npm ci is the correct command when lockfiles are committed:
      #   - Reproducible: installs exactly the versions in the lockfile
      #   - Faster than npm install (skips dependency resolution)
      #   - Fails if package.json and lockfile are out of sync (catches drift early)
      #   - Does not modify the lockfile
      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      # Unit tests — pure functions + counter (uses MongoMemoryReplSet).
      # No external services beyond the in-process replica set.
      - name: Run unit tests
        run: npm run test:unit
        env:
          NODE_ENV: test

      # Integration tests — full auth, device, rate-limit, isolation flows.
      # MongoMemoryReplSet required; binary served from cache above.
      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test

      # Security tests — headers, auth boundary, injection, sensitive data exposure.
      - name: Run security tests
        run: npm run test:security
        env:
          NODE_ENV: test

      # Verify the React/Vite build produces no errors.
      # working-directory: client runs the client's own build script directly
      # rather than going through the root npm run build --prefix client alias.
      - name: Build frontend
        run: npm run build
        working-directory: client
        env:
          VITE_API_URL: https://swipeledger.onrender.com/api/v1

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: swipeledger-frontend
          path: client/dist

  # ── Android APK ───────────────────────────────────────────────────────────────
  # Runs only after every test + frontend build step in the `test` job passes.
  # Installs Capacitor inline (not in package.json) so the test job's npm ci
  # against the committed client/package-lock.json is never disturbed.
  android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Java 17 is required by the Android Gradle plugin used by Capacitor 6.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # npm install (not npm ci) — we are about to add Capacitor packages on top
      # of the committed package.json, so we do not want the lockfile-check that
      # npm ci enforces.  This step is isolated to the Android job's workspace.
      - name: Install client dependencies
        run: npm install
        working-directory: client

      # Install Capacitor into the job-local node_modules.  These packages are
      # NOT added to the committed package.json / package-lock.json, keeping the
      # test job's npm ci clean and unaffected.
      - name: Install Capacitor packages
        run: npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
        working-directory: client

      # Build the production web bundle into client/dist — exactly the same
      # command and env var used by the test job's "Build frontend" step.
      - name: Build frontend
        run: npm run build
        working-directory: client
        env:
          VITE_API_URL: https://swipeledger.onrender.com/api/v1

      # Create the Android project under client/android/ using capacitor.config.json
      # already committed to the repository.  cap add android reads webDir ("dist")
      # and appId / appName from that file.
      - name: Add Android platform
        run: npx cap add android
        working-directory: client

      # Copy client/dist into the Android WebView assets directory and apply any
      # Capacitor plugin configuration.
      - name: Sync web assets to Android project
        run: npx cap sync android
        working-directory: client

      # The Gradle wrapper is created by cap add android but may not carry the
      # executable bit through npm's file extraction; set it explicitly.
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew
        working-directory: client

      # ubuntu-latest ships with Android SDK (ANDROID_HOME set).
      # The Gradle wrapper downloads the correct Gradle distribution on first run.
      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: client/android

      # Upload the generated APK as a named artifact downloadable from the
      # Actions run summary page.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: swipeledger-android-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
